grid_size: [43, 43]

military_zones:
- start_square: [1, 1]   # (col, row) block coords, 0-indexed
  width: 4
  height_fraction: 0.6   # military zone: rows 14-17, cols 14-42

buildings:
# 4 buildings per block, arranged as 2x2 icons at the 4 interior corners:
#   TL [ry*10+4, cx*10+4], TR [ry*10+4, cx*10+7],
#   BL [ry*10+7, cx*10+4], BR [ry*10+7, cx*10+7]  (size [2,2] each)
# block_id = ry*4 + cx + 1
# Military blocks (6, 7, 8) only render one House at their top-right corner;
# a 5x5 phantom (render: false) sets the block_id over the full interior so
# add_mid()/add_intersections() still see the correct bounding box.

# --- Block 1 (cx=0, ry=0) ---
- {block: 1, height: 20, position: [4, 4], size: [2, 2], type: Office}
- {block: 1, height: 20, position: [4, 7], size: [2, 2], type: House}
- {block: 1, height: 20, position: [7, 4], size: [2, 2], type: Store}
- {block: 1, height: 20, position: [7, 7], size: [2, 2], type: Gas Station}
# --- Block 2 (cx=1, ry=0) ---
- {block: 2, height: 20, position: [4, 14], size: [2, 2], type: House}
- {block: 2, height: 20, position: [4, 17], size: [2, 2], type: Store}
- {block: 2, height: 20, position: [7, 14], size: [2, 2], type: Office}
- {block: 2, height: 20, position: [7, 17], size: [2, 2], type: Garage}
# --- Block 3 (cx=2, ry=0) ---
- {block: 3, height: 20, position: [4, 24], size: [2, 2], type: Store}
- {block: 3, height: 20, position: [4, 27], size: [2, 2], type: Office}
- {block: 3, height: 20, position: [7, 24], size: [2, 2], type: Gas Station}
- {block: 3, height: 20, position: [7, 27], size: [2, 2], type: House}
# --- Block 4 (cx=3, ry=0) ---
- {block: 4, height: 20, position: [4, 34], size: [2, 2], type: Gas Station}
- {block: 4, height: 20, position: [4, 37], size: [2, 2], type: Garage}
- {block: 4, height: 20, position: [7, 34], size: [2, 2], type: House}
- {block: 4, height: 20, position: [7, 37], size: [2, 2], type: Office}
# --- Block 5 (cx=0, ry=1) ---
- {block: 5, height: 20, position: [14, 4], size: [2, 2], type: Garage}
- {block: 5, height: 20, position: [14, 7], size: [2, 2], type: Office}
- {block: 5, height: 20, position: [17, 4], size: [2, 2], type: Store}
- {block: 5, height: 20, position: [17, 7], size: [2, 2], type: House}
# --- Block 6 (cx=1, ry=1)  MILITARY ---
- {block: 6, height: 20, position: [14, 14], size: [5, 5], type: House, render: false}
- {block: 6, height: 20, position: [15, 17], size: [2, 2], type: House}
# --- Block 7 (cx=2, ry=1)  MILITARY ---
- {block: 7, height: 20, position: [14, 24], size: [5, 5], type: House, render: false}
- {block: 7, height: 20, position: [15, 27], size: [2, 2], type: House}
# --- Block 8 (cx=3, ry=1)  MILITARY ---
- {block: 8, height: 20, position: [14, 34], size: [5, 5], type: House, render: false}
- {block: 8, height: 20, position: [15, 37], size: [2, 2], type: House}
# --- Block 9 (cx=0, ry=2) ---
- {block: 9, height: 20, position: [24, 4], size: [2, 2], type: Office}
- {block: 9, height: 20, position: [24, 7], size: [2, 2], type: Store}
