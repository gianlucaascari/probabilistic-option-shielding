Rules:
  Sim:
  Task:
    - name: Don't collide with other agents
      description: you should not collide with other agents
      immediate: true
      dead: true
      reward: 0
      formula: |
        Not(Collided(entity))
    - name: Don't enter military zone
      description: agent dies immediately upon entering a military zone cell
      immediate: true
      dead: true
      reward: 0
      formula: |
        Not(InMilitaryZone(entity))
