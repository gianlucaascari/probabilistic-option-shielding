# POS-PPO Online (neural critic) on the Large Map (Figure 3 and Appendix D).
algorithm: POS-PPO
env: env.yaml
shield: env/shield.pl
total_timesteps: 500000
hyperparameters:
  num_options: 4
  gamma: 0.995
  learning_rate: 1.0e-4
  clip_range: 0.15
  vf_coef: 0.5
  ent_coef: 0.01
  n_epochs: 8
  n_steps: 512            # options per rollout
  batch_size: 128
  stats_window_size: 100
  # POS: neural critic learned online
  critic: neural
  hidden_sizes: [64, 64]
  output_power: 4       # P(safe|s,o) = sigmoid(z)^k
  critic_lr: 5.0e-4
  critic_grad_steps: 2      # per option decision
  critic_batch_size: 128
  critic_buffer_size: 500000
  polyak_tau: 0.005
  alpha: 0.5             # weight of the safety loss
