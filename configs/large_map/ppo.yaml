# PPO on the Large Map (Figure 3).
algorithm: PPO
env: env.yaml
total_timesteps: 500000
hyperparameters:
  gamma: 0.995
  learning_rate: 1.0e-4
  clip_range: 0.15
  vf_coef: 0.5
  ent_coef: 0.01
  n_epochs: 8
  n_steps: 2048           # env steps per rollout
  batch_size: 512
  stats_window_size: 100
