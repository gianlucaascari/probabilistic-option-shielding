# Pretraining of checkpoints/large_map/neural_critic.pt (POS-PPO Pretrained, Figure 3).
env: env.yaml
shield: env/shield.pl
dataset: data/large_map_uniform_random_start.pkl
collect:
  steps: 200000
  exploration: uniform      # options drawn uniformly at random
  random_start: true        # episodes start where options end, not at the task start
fit:
  critic: neural
  hidden_sizes: [64, 64]
  output_power: 4
  lr: 0.01
  lr_plateau: {patience: 100, factor: 0.5, min_lr: 0.001}   # patience in 100-step windows
  batch_size: 128
  gradient_steps: 2000000
  polyak_tau: 0.005
  seed: 4                   # network initialisation
  sampling_seed: 42         # minibatch order
