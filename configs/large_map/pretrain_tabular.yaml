# Pretraining of checkpoints/large_map/tabular_critic.npy (Appendix D).
env: env.yaml
shield: env/shield.pl
dataset: data/large_map_count_ucb.pkl
collect:
  steps: 2000000
  exploration: count_ucb    # P(o | s) proportional to (N(s, o) + 1)^-ucb_beta
  ucb_beta: 1.0
fit:
  critic: tabular
  table_shape: [43, 43, 2]  # rows, cols, school_time
  alpha: 0.1
  max_passes: 10000
  tolerance: 1.0e-4         # stop when no entry changes more than this in a pass
  plateau: {patience: 25, factor: 0.5, min_alpha: 1.0e-5}
  seed: 0                   # shuffling order
