# Figures for the Stochastic Map: mean over seeds, shaded standard error.
# Reference line: value of the optimal option-level policy under inertia (value iteration
# over position and last executed action), averaged over school time.
reference: {y: 0.7401, label: "Optimal option-level policy"}

figures:
  figure4:
    arms:
      ppo:                        {label: "PPO",           color: C1, linestyle: "--", zorder: 2}
      ppo_pls:                    {label: "PPO-PLS",       color: C1, linestyle: "-",  zorder: 2}
      option_ppo:                 {label: "OptionPPO",     color: C3, linestyle: "--", zorder: 3}
      option_ppo_rs:              {label: "OptionPPO-RS",  color: C3, linestyle: "-.", zorder: 3}
      option_ppo_lag:             {label: "OptionPPO-Lag", color: C3, linestyle: "-",  zorder: 3}
      pos_ppo_online_neural:      {label: "POS-PPO Online (ours)",     color: C2, linestyle: "-", zorder: 4}
      pos_ppo_pretrained_neural:  {label: "POS-PPO Pretrained (ours)", color: C0, linestyle: "-", zorder: 5}
    legend_columns:
      - [ppo, ppo_pls]
      - [option_ppo, option_ppo_rs, option_ppo_lag]
      - [pos_ppo_online_neural, pos_ppo_pretrained_neural, reference]
    band_alpha: 0.12
  figure11:
    arms:
      pos_ppo_online_tabular:     {label: "POS-PPO Online Tabular (ours)",     color: C2, linestyle: "--", zorder: 4}
      pos_ppo_online_neural:      {label: "POS-PPO Online Neural (ours)",      color: C2, linestyle: "-",  zorder: 4}
      pos_ppo_pretrained_tabular: {label: "POS-PPO Pretrained Tabular (ours)", color: C0, linestyle: "--", zorder: 5}
      pos_ppo_pretrained_neural:  {label: "POS-PPO Pretrained Neural (ours)",  color: C0, linestyle: "-",  zorder: 5}
    legend_columns:
      - [pos_ppo_online_tabular, pos_ppo_online_neural]
      - [pos_ppo_pretrained_tabular, pos_ppo_pretrained_neural]
      - [reference]
    band_alpha: 0.18
