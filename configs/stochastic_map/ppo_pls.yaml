# PPO-PLS on the Stochastic Map (Figure 4).
algorithm: PPO-PLS
env: env.yaml
shield: env/shield.pl
total_timesteps: 500000
hyperparameters:
  alpha: 0.5             # weight of the PLS safety loss
  learning_rate: 1.0e-4
  clip_range: 0.15
  vf_coef: 0.5
  ent_coef: 0.01
  n_epochs: 8
  n_steps: 512           # env steps per rollout
  batch_size: 128
  stats_window_size: 100
